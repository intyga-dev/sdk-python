[build-system]
# 77.0.0, not 61: the metadata below uses the PEP 639 forms (`license` as a bare SPDX string and a
# `license-files` key), which earlier setuptools validates against the PEP 621 table form and
# rejects. A resolver picking anything in 61..76 — permitted by the old pin — failed the build.
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intyga-sdk"
version = "1.0.0"
description = "INTYGA SDK — require a cryptographically-signed human approval for any high-risk action, and verify the receipt offline"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "INTYGA" }]
keywords = ["authorization", "human-approval", "webauthn", "passkey", "audit", "receipts", "ai-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography>=40.0.0",
    "httpx>=0.28.1,<0.29",
]

# Declared explicitly rather than left to setuptools' flat-layout auto-discovery. The published
# repo (scripts/build-public-tree.sh) vendors the shared golden vectors into a top-level vectors/
# dir next to intyga_sdk/, and auto-discovery then sees two top-level packages and refuses to build
# at all. Naming the package keeps the sdist/wheel to the SDK and the vectors to the repo.
[tool.setuptools]
packages = ["intyga_sdk"]

# Ship the PEP 561 marker so type checkers consume the annotations.
[tool.setuptools.package-data]
intyga_sdk = ["py.typed"]

[project.urls]
Homepage = "https://www.intyga.com"
Repository = "https://github.com/intyga-dev/sdk-python"
Issues = "https://github.com/intyga-dev/sdk-python/issues"
